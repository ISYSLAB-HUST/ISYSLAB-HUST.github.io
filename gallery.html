<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery · iSyslab, HUST</title>
<meta name="description" content="Moments from the lab — group photos, conference talks and research demos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<script src="assets/js/i18n.js"></script>
</head>
<body data-page="gallery">
<div class="shell">
  <div id="site-navbar"></div>

  <header class="page-hero page-header">
    <div class="breadcrumb">
      <a href="index.html" data-i18n="crumb.home">Home</a>
      <span class="sep">/</span>
      <span data-i18n="gal.crumb">Gallery</span>
    </div>
    <h1 class="page-title" data-i18n="gal.title">Gallery</h1>
    <p class="page-sub" data-i18n="gal.sub">Moments from the lab — group photos, conference talks and research demos.</p>
  </header>

  <section class="gallery-body">

    <div class="album">
      <div class="album-head">
        <span class="album-title" data-i18n="gal.a1">Lab Photos</span>
        <span class="album-count" data-i18n="gal.count1">1 photo</span>
      </div>
      <div class="photo-row">
        <figure class="photo">
          <div class="photo-img" role="img" data-i18n-aria="gal.p1" aria-label="Lab Group Photo 2024"></div>
          <figcaption class="photo-caption" data-i18n="gal.p1">Lab Group Photo 2024</figcaption>
        </figure>
      </div>
      <p class="album-note" data-i18n="gal.note">Add more photos to /assets/img/gallery/ — the grid grows automatically.</p>
    </div>

    <div class="album">
      <div class="album-head">
        <span class="album-title" data-i18n="gal.a2">Events</span>
        <span class="album-count" data-i18n="gal.count1">1 photo</span>
      </div>
      <div class="photo-row">
        <figure class="photo">
          <div class="photo-img" role="img" data-i18n-aria="gal.p2" aria-label="Conference Presentation 2024"></div>
          <figcaption class="photo-caption" data-i18n="gal.p2">Conference Presentation 2024</figcaption>
        </figure>
      </div>
    </div>

    <div class="album">
      <div class="album-head">
        <span class="album-title" data-i18n="gal.a3">Research Highlights</span>
        <span class="album-count" data-i18n="gal.count1">1 photo</span>
      </div>
      <div class="photo-row">
        <figure class="photo">
          <div class="photo-img" role="img" data-i18n-aria="gal.p3" aria-label="Research Project Demo"></div>
          <figcaption class="photo-caption" data-i18n="gal.p3">Research Project Demo</figcaption>
        </figure>
      </div>
    </div>

  </section>

  <div id="site-footer"></div>
</div>
<script src="assets/js/main.js"></script>
</body>
</html>
