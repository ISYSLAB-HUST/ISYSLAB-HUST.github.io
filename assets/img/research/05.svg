<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" font-family="Inter, 'Noto Sans SC', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FAFD"/>
      <stop offset="1" stop-color="#EBF1F8"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B4C7E"/>
      <stop offset="1" stop-color="#1B3457"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#C9D6E4" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="840" height="480" fill="url(#bg)"/>
  <rect width="840" height="480" fill="url(#dots)"/>
  <circle cx="420" cy="250" r="185" fill="#E8590C" opacity="0.05"/>
  <circle cx="720" cy="90" r="120" fill="#2B4C7E" opacity="0.06"/>

  <!-- eyebrow -->
  <text x="42" y="58" font-size="15" font-weight="700" letter-spacing="3" fill="#8AA0B8">05 · AI SECURITY &amp; PRIVACY</text>
  <rect x="42" y="68" width="44" height="3" rx="1.5" fill="#E8590C"/>

  <!-- ============ center: shield ============ -->
  <g transform="translate(420,236)">
    <path d="M0 -118 C 44 -96, 88 -88, 108 -84 C 108 -6, 78 76, 0 122 C -78 76, -108 -6, -108 -84 C -88 -88, -44 -96, 0 -118 z" fill="url(#shield)"/>
    <path d="M0 -96 C 36 -78, 72 -71, 88 -68 C 88 -2, 62 62, 0 100 C -62 62, -88 -2, -88 -68 C -72 -71, -36 -78, 0 -96 z" fill="none" stroke="#5E82B8" stroke-width="1.6" opacity="0.8"/>
    <!-- keyhole -->
    <circle cx="0" cy="-16" r="17" fill="#F2A65A"/>
    <path d="M-7 -6 L -11 34 H 11 L 7 -6 z" fill="#F2A65A"/>
  </g>
  <text x="420" y="404" font-size="13" font-weight="700" fill="#2B4C7E" text-anchor="middle" letter-spacing="2">TRUSTWORTHY AI</text>

  <!-- ============ left: adversarial attack vs robustness ============ -->
  <g transform="translate(56,110)">
    <rect x="0" y="0" width="200" height="140" rx="14" fill="#FFFFFF" stroke="#C9D6E4"/>
    <text x="14" y="24" font-size="11.5" font-weight="700" fill="#8AA0B8" letter-spacing="1.5">ADVERSARIAL ROBUSTNESS</text>
    <!-- clean vs noisy sample -->
    <rect x="16" y="40" width="46" height="46" rx="8" fill="#DCE7F5"/>
    <path d="M26 70 c6 -10 14 -10 26 0" stroke="#2B4C7E" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <circle cx="30" cy="56" r="3" fill="#2B4C7E"/><circle cx="48" cy="56" r="3" fill="#2B4C7E"/>
    <g fill="#E8590C">
      <rect x="104" y="40" width="46" height="46" rx="8" fill="#FBE3D6"/>
      <rect x="110" y="46" width="4" height="4" opacity="0.9"/><rect x="120" y="58" width="4" height="4" opacity="0.7"/><rect x="132" y="48" width="4" height="4" opacity="0.85"/><rect x="114" y="70" width="4" height="4" opacity="0.7"/><rect x="130" y="74" width="4" height="4" opacity="0.9"/><rect x="138" y="62" width="4" height="4" opacity="0.6"/>
    </g>
    <text x="39" y="106" font-size="10.5" fill="#8AA0B8" text-anchor="middle" font-weight="600">clean</text>
    <text x="127" y="106" font-size="10.5" fill="#E8590C" text-anchor="middle" font-weight="700">+perturbation</text>
    <path d="M68 63 H 96 m-6 -5 6 5 -6 5" stroke="#E8590C" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- robust verdict -->
    <rect x="16" y="116" width="134" height="14" rx="7" fill="#E7F0FA"/>
    <text x="83" y="127" font-size="9.5" font-weight="700" fill="#2B4C7E" text-anchor="middle" letter-spacing="1">ROBUST · CERTIFIED</text>
  </g>

  <!-- risky dialogue detection -->
  <g transform="translate(56,286)">
    <rect x="0" y="0" width="200" height="130" rx="14" fill="#FFFFFF" stroke="#C9D6E4"/>
    <text x="14" y="24" font-size="11.5" font-weight="700" fill="#8AA0B8" letter-spacing="1.5">DIALOGUE RISK DETECTION</text>
    <path d="M22 44 h96 a10 10 0 0 1 10 10 v14 a10 10 0 0 1 -10 10 h-74 l-14 14 v-14 h-8 a10 10 0 0 1 -10 -10 v-14 a10 10 0 0 1 10 -10 z" fill="#E7F0FA"/>
    <path d="M30 56 h80 M30 66 h56" stroke="#9DB8D8" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="160" cy="60" r="16" fill="#FBE3D6"/>
    <path d="M153 53 l14 14 m0 -14 l-14 14" stroke="#E8590C" stroke-width="2.6" stroke-linecap="round"/>
    <text x="160" y="94" font-size="10.5" fill="#E8590C" text-anchor="middle" font-weight="700">blocked</text>
    <text x="100" y="118" font-size="10.5" fill="#8AA0B8" text-anchor="middle" font-weight="600">emotion · violence tendency</text>
  </g>

  <!-- flows to shield -->
  <path d="M266 180 C 306 186, 322 192, 342 196" stroke="#E8590C" stroke-width="2" fill="none" stroke-dasharray="4 4" stroke-linecap="round"/>
  <path d="M266 348 C 306 342, 322 336, 342 330" stroke="#E8590C" stroke-width="2" fill="none" stroke-dasharray="4 4" stroke-linecap="round"/>

  <!-- ============ right: LLM safety ============ -->
  <g transform="translate(592,110)">
    <rect x="0" y="0" width="204" height="140" rx="14" fill="#FFFFFF" stroke="#C9D6E4"/>
    <text x="14" y="24" font-size="11.5" font-weight="700" fill="#8AA0B8" letter-spacing="1.5">LLM SAFETY</text>
    <!-- jailbreak prompt -->
    <rect x="16" y="40" width="112" height="34" rx="9" fill="#FBE3D6"/>
    <text x="24" y="61" font-size="10" font-weight="700" fill="#E8590C">jailbreak prompt</text>
    <path d="M134 57 H 152 m-6 -5 6 5 -6 5" stroke="#E8590C" stroke-width="2" fill="none" stroke-linecap="round"/>
    <rect x="158" y="42" width="30" height="30" rx="15" fill="#2B4C7E"/>
    <path d="M166 57 l5 6 9 -12" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- watermark ripple -->
    <text x="16" y="102" font-size="10.5" fill="#8AA0B8" font-weight="700">WATERMARK</text>
    <g fill="none" stroke="#5E82B8" stroke-width="1.8">
      <circle cx="106" cy="98" r="7"/>
      <circle cx="106" cy="98" r="13" opacity="0.55"/>
      <circle cx="106" cy="98" r="19" opacity="0.3"/>
    </g>
    <text x="152" y="102" font-size="10" fill="#8AA0B8" font-weight="600">provenance</text>
  </g>

  <!-- privacy-preserving learning -->
  <g transform="translate(592,286)">
    <rect x="0" y="0" width="204" height="130" rx="14" fill="#FFFFFF" stroke="#C9D6E4"/>
    <text x="14" y="24" font-size="11.5" font-weight="700" fill="#8AA0B8" letter-spacing="1.5">PRIVACY-PRESERVING ML</text>
    <!-- distributed nodes with lock -->
    <g stroke="#9DB8D8" stroke-width="1.8">
      <path d="M40 84 L 96 60"/><path d="M40 84 L 96 84"/><path d="M96 60 L 152 84"/><path d="M96 84 L 152 84"/>
    </g>
    <g fill="#DCE7F5" stroke="#2B4C7E" stroke-width="1.8">
      <circle cx="40" cy="84" r="12"/><circle cx="152" cy="84" r="12"/>
    </g>
    <circle cx="96" cy="60" r="12" fill="#2B4C7E"/>
    <!-- lock glyph -->
    <rect x="86" y="94" width="20" height="16" rx="4" fill="#E8590C"/>
    <path d="M90 94 v-5 a6 6 0 0 1 12 0 v5" fill="none" stroke="#E8590C" stroke-width="2.4"/>
    <text x="102" y="46" font-size="10.5" fill="#8AA0B8" text-anchor="middle" font-weight="600">gradient · secure agg.</text>
  </g>

  <!-- ============ bottom: blockchain rights ============ -->
  <g transform="translate(300,424)">
    <g>
      <rect x="0" y="0" width="58" height="40" rx="8" fill="#FFFFFF" stroke="#2B4C7E" stroke-width="1.8"/>
      <rect x="12" y="0" width="34" height="12" rx="4" fill="#2B4C7E"/>
      <path d="M12 22 h34 M12 30 h22" stroke="#9DB8D8" stroke-width="2.2" stroke-linecap="round"/>
      <rect x="78" y="0" width="58" height="40" rx="8" fill="#FFFFFF" stroke="#2B4C7E" stroke-width="1.8"/>
      <rect x="90" y="0" width="34" height="12" rx="4" fill="#2B4C7E"/>
      <path d="M90 22 h34 M90 30 h22" stroke="#9DB8D8" stroke-width="2.2" stroke-linecap="round"/>
      <rect x="156" y="0" width="58" height="40" rx="8" fill="#FFFFFF" stroke="#2B4C7E" stroke-width="1.8"/>
      <rect x="168" y="0" width="34" height="12" rx="4" fill="#2B4C7E"/>
      <path d="M168 22 h34 M168 30 h22" stroke="#9DB8D8" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <g stroke="#E8590C" stroke-width="2.2" stroke-linecap="round">
      <path d="M58 20 H 78"/><path d="M136 20 H 156"/>
    </g>
  </g>
  <text x="530" y="449" font-size="10.5" font-weight="700" fill="#2B4C7E" letter-spacing="0.5">DATA RIGHTS · BLOCKCHAIN CONFIRMATION</text>
  <path d="M420 366 V 418" stroke="#2B4C7E" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
</svg>
