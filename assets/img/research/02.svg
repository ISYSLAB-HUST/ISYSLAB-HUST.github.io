<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" font-family="Inter, 'Noto Sans SC', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FAFD"/>
      <stop offset="1" stop-color="#EBF1F8"/>
    </linearGradient>
    <linearGradient id="vr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1FC2B8"/>
      <stop offset="1" stop-color="#0E9488"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#C9D6E4" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="840" height="480" fill="url(#bg)"/>
  <rect width="840" height="480" fill="url(#dots)"/>
  <circle cx="140" cy="90" r="140" fill="#0FA8A0" opacity="0.06"/>
  <circle cx="720" cy="410" r="150" fill="#2E7BF6" opacity="0.06"/>

  <!-- eyebrow -->
  <text x="42" y="58" font-size="15" font-weight="700" letter-spacing="3" fill="#8AA0B8">02 · VR &amp; SERIOUS GAMES</text>
  <rect x="42" y="68" width="44" height="3" rx="1.5" fill="#0FA8A0"/>

  <!-- ============ redirected-walking perspective grid ============ -->
  <g stroke="#9FC4BC" stroke-width="1.4" opacity="0.85" fill="none">
    <!-- horizon rays -->
    <path d="M120 430 L 330 268"/>
    <path d="M280 446 L 356 268"/>
    <path d="M440 452 L 396 268"/>
    <path d="M600 446 L 436 268"/>
    <path d="M760 430 L 462 268"/>
    <!-- depth lines -->
    <path d="M288 300 H 504"/>
    <path d="M242 338 H 552"/>
    <path d="M180 382 H 614"/>
    <path d="M96 430 H 700"/>
  </g>
  <!-- walking path with slight curve (redirected) -->
  <path d="M396 452 C 380 380, 420 330, 400 272" stroke="#0FA8A0" stroke-width="3" fill="none" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.8"/>

  <!-- ============ VR headset ============ -->
  <g transform="translate(420,170)">
    <rect x="-92" y="-46" width="184" height="96" rx="34" fill="url(#vr)"/>
    <rect x="-92" y="-46" width="184" height="96" rx="34" fill="none" stroke="#0B7E74" stroke-opacity="0.5"/>
    <rect x="-66" y="-26" width="66" height="52" rx="16" fill="#0B3B38" opacity="0.55"/>
    <rect x="2" y="-26" width="66" height="52" rx="16" fill="#0B3B38" opacity="0.55"/>
    <rect x="-58" y="-16" width="46" height="30" rx="11" fill="#7BE8E0" opacity="0.8"/>
    <rect x="10" y="-16" width="46" height="30" rx="11" fill="#7BE8E0" opacity="0.8"/>
    <circle cx="74" cy="2" r="7" fill="#0B7E74"/>
    <!-- straps -->
    <path d="M-92 -12 C -122 -8, -128 10, -120 34" stroke="#0E9488" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M92 -12 C 122 -8, 128 10, 120 34" stroke="#0E9488" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <text x="420" y="270" font-size="13" font-weight="700" fill="#0E9488" text-anchor="middle" letter-spacing="2">IMMERSIVE HMD</text>

  <!-- ============ motion capture skeleton ============ -->
  <g transform="translate(150,190)" stroke="#33475E" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="0" cy="-46" r="13" fill="#33475E" stroke="none"/>
    <path d="M0 -32 V 14"/>
    <path d="M0 -22 L -30 -4 M0 -22 L 30 -4"/>
    <path d="M0 14 L -24 52 M0 14 L 24 52"/>
    <!-- tracking markers -->
    <g fill="#0FA8A0" stroke="none">
      <circle cx="0" cy="-46" r="4"/>
      <circle cx="-30" cy="-4" r="4"/>
      <circle cx="30" cy="-4" r="4"/>
      <circle cx="-24" cy="52" r="4"/>
      <circle cx="24" cy="52" r="4"/>
    </g>
    <!-- pulse rings -->
    <circle cx="0" cy="0" r="66" stroke="#0FA8A0" stroke-width="1.6" opacity="0.5"/>
    <circle cx="0" cy="0" r="86" stroke="#0FA8A0" stroke-width="1.4" opacity="0.28"/>
  </g>
  <text x="150" y="296" font-size="12.5" font-weight="700" fill="#5B6B80" text-anchor="middle" letter-spacing="1.5">MOTION TRACKING</text>

  <!-- ============ balance assessment curve ============ -->
  <g transform="translate(596,150)">
    <rect x="0" y="0" width="200" height="118" rx="14" fill="#FFFFFF" stroke="#C9D6E4"/>
    <text x="14" y="24" font-size="11.5" font-weight="700" fill="#8AA0B8" letter-spacing="1.5">BALANCE · COP PATH</text>
    <path d="M14 92 C 40 60, 56 96, 82 66 S 128 40, 148 62 176 48" stroke="#0FA8A0" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <g fill="#0FA8A0">
      <circle cx="14" cy="92" r="3.5"/>
      <circle cx="82" cy="66" r="3.5"/>
      <circle cx="148" cy="62" r="3.5"/>
      <circle cx="182" cy="50" r="4.5"/>
    </g>
    <path d="M14 30 H 60" stroke="#C9D6E4" stroke-width="2" stroke-linecap="round"/>
    <path d="M14 38 H 44" stroke="#C9D6E4" stroke-width="2" stroke-linecap="round"/>
  </g>
  <path d="M560 210 C 576 204, 584 196, 596 188" stroke="#0FA8A0" stroke-width="2" fill="none" stroke-dasharray="4 4" stroke-linecap="round"/>

  <!-- ============ game HUD elements ============ -->
  <g transform="translate(120,362)">
    <rect x="0" y="0" width="250" height="62" rx="14" fill="#FFFFFF" stroke="#C9D6E4"/>
    <text x="16" y="26" font-size="11.5" font-weight="700" fill="#8AA0B8" letter-spacing="1.5">ADAPTIVE REHAB GAME</text>
    <rect x="16" y="38" width="176" height="10" rx="5" fill="#E4EBF3"/>
    <rect x="16" y="38" width="118" height="10" rx="5" fill="#0FA8A0"/>
    <circle cx="216" cy="43" r="14" fill="#0FA8A0"/>
    <path d="M210 43 l4 5 8 -10" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- gamepad -->
  <g transform="translate(620,362)">
    <rect x="0" y="6" width="120" height="56" rx="26" fill="#FFFFFF" stroke="#C9D6E4"/>
    <circle cx="32" cy="34" r="11" fill="none" stroke="#0FA8A0" stroke-width="2.4"/>
    <path d="M27 34 h10 M32 29 v10" stroke="#0FA8A0" stroke-width="2.4" stroke-linecap="round"/>
    <g fill="#0FA8A0">
      <circle cx="88" cy="28" r="5"/>
      <circle cx="100" cy="40" r="5"/>
    </g>
    <circle cx="60" cy="34" r="6" fill="#E4EBF3"/>
  </g>
  <path d="M376 393 H 610" stroke="#9FC4BC" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round"/>
</svg>
