<nav class="lab-nav" aria-label="Main navigation">
  <div class="lab-nav-inner">
    <a class="lab-brand" href="{{ '/' | relative_url }}" aria-label="iSyslab home"><img src="{{ '/assets/img/isyslab-wordmark.svg' | relative_url }}" width="169" height="47" alt="iSyslab · HUST"></a>
    <div class="lab-nav-links">
      {% for link in site.navbar-links %}
      {% assign current_path = page.url | remove: 'index.html' | remove: '/' %}
      {% assign link_path = link[1] | remove: '/' %}
      <a href="{{ link[1] | relative_url }}"{% if current_path == link_path %} aria-current="page"{% endif %}>{{ link[0] }}</a>
      {% endfor %}
    </div>
  </div>
</nav>
